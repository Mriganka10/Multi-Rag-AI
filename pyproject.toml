[project]
name = "ca-agentic-ai-rag"
version = "0.1.0"
description = "Agentic multi-RAG POC for Chartered Accountant workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.2.0",
    "pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.34.0",
    "openai>=1.86.0",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.9.0",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
